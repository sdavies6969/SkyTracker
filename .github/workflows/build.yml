      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build both editions
        working-directory: proj
        run: gradle assemblePersonalDebug assembleStoreDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Horizonaut-PERSONAL-apk
          path: proj/app/build/outputs/apk/personal/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Horizonaut-STORE-trial-apk
          path: proj/app/build/outputs/apk/store/debug/*.apk
